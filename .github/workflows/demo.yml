name: Practica-Parte6

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Introduce un mensaje"
        required: true
        type: string

jobs:
  mostrar-mensaje:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar-mensaje
        env:
          MENSAJE: ${{ inputs.mensaje }}
        run: echo "$MENSAJE"